# Illustrative Gate-D policy fixture for SyncMill's read-only MCP gateway.
#
# This models the ambient tool surface available around a SyncMill run. It does
# not claim that SyncMill's CLI agents call MCP tools themselves.

agents:
  - codex
  - kimi

policies:
  - id: board-operations-deny
    effect: DENY
    scope: syncmill-board
    description: Board operational metadata is restricted in this smoke.

grants:
  - {agent: codex, tool: "syncmill::shared_read", granted_by: smoke}
  - {agent: codex, tool: "syncmill::board_stats", granted_by: smoke}
  - {agent: kimi, tool: "syncmill::shared_read", granted_by: smoke}
  - {agent: kimi, tool: "syncmill::board_stats", granted_by: smoke}

data_access:
  - tool: "syncmill::shared_read"
    resource: "syncmill:shared-memory"
    mode: READS
    provenance:
      source: operator_asserted
      confidence: high
      evidence: "syncmill read-only MCP gateway contract"
  - tool: "syncmill::board_stats"
    resource: "syncmill:board:operations"
    mode: READS
    provenance:
      source: operator_asserted
      confidence: high
      evidence: "syncmill read-only MCP gateway contract"

governed_by:
  "syncmill:board:operations":
    - policy: board-operations-deny
      provenance:
        source: operator_asserted
        confidence: high
        evidence: "Gate-D smoke policy fixture"

expected_exceptions:
  - agent: kimi
    tool: "syncmill::board_stats"
    resource: "syncmill:board:operations"
    policy: board-operations-deny
    reason: "Kimi is the designated board operator in the Gate-D smoke"
