# Gate exhibit governance — over the user's own memtomem + memtomem-stm.
#
# The wedge: memtomem-stm's `surfacing` engine (memtomem_stm/surfacing/engine.py)
# is invoked on EVERY proxied tool response via
# `memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing` and
# calls `mem_search` on the upstream memtomem server through
# `memtomem_stm/surfacing/mcp_client.py::McpClientSearchAdapter.search`.
# The result is injected into the proxied response.
#
# Concretely on this host: ~/.memtomem/stm_proxy.json declares
# `docs-langchain` and `langfuse-docs` as upstreams. ~/.memtomem/config.json
# routes files under ~/.claude/projects/*/memory/** to the namespace
# `claude:<project>`, including this very repo's project memory.
#
# So an agent granted only `langchain__search_docs_by_lang_chain` ("just
# searches public LangChain docs") indirectly reads the operator's personal
# LTM on every call — surfacing prepends memtomem mem_search hits to the
# response. The tool description never mentions memtomem or any namespace.
#
# A vector/embedding registry indexing tool descriptions cannot link the
# proxied docs tool to the namespace it transitively touches. toolgraph
# composes the authored surfacing edge across servers and flags the grant.

agents:
  - owner        # the user — full LTM access
  - planner      # subagent that may read project-scoped LTM and use docs+surfacing
  - helper       # docs-only agent: MUST NOT surface operator personal LTM
  - stm-proxy    # consumer wiring fixture, NOT part of the leakage story:
                 # the memtomem-stm process itself, the shipped eligible_tools
                 # consumer (memtomem-stm#465), which consults this graph at
                 # proxy startup under agent_id "stm-proxy". Present so
                 # `eligible-tools stm-proxy …` runs against the exhibit
                 # instead of aborting on agent_found=false. See README
                 # "Wiring the shipped consumer" — live refs differ in shape.

policies:
  - id: operator-ltm-confidentiality
    effect: DENY
    scope: personal-memory-leakage
    description: >
      The operator's personal LTM (claude:* and codex namespaces) holds
      working notes, plans, and project context that must not leak into
      responses surfaced to non-trusted agents.
    # Per-binding evidence lives on the GOVERNED_BY edge (see governed_by:
    # below) — that's where "WHY this resource is under this policy" belongs.

# Agent -[:CAN_CALL]-> Tool
grants:
  # owner has the full memtomem surface
  - {agent: owner, tool: "memtomem::mem_add", granted_by: user}
  - {agent: owner, tool: "memtomem::mem_search", granted_by: user}
  - {agent: owner, tool: "memtomem::mem_read", granted_by: user}
  - {agent: owner, tool: "memtomem::mem_recall", granted_by: user}

  # planner may search/read memtomem directly + use docs (surfacing OK by design)
  - {agent: planner, tool: "memtomem::mem_search", granted_by: user}
  - {agent: planner, tool: "memtomem::mem_read", granted_by: user}
  - {agent: planner, tool: "memtomem-stm::langchain__search_docs_by_lang_chain", granted_by: user}
  - {agent: planner, tool: "memtomem-stm::langfuse__searchLangfuseDocs", granted_by: user}

  # helper: ONLY proxied docs grants — no direct memtomem access at all
  - {agent: helper, tool: "memtomem-stm::langchain__search_docs_by_lang_chain", granted_by: user}
  - {agent: helper, tool: "memtomem-stm::langfuse__searchLangfuseDocs", granted_by: user}
  - {agent: helper, tool: "memtomem-stm::langfuse__getLangfuseDocsPage", granted_by: user}
  - {agent: helper, tool: "memtomem-stm::langfuse__getLangfuseOverview", granted_by: user}

  # stm-proxy (wiring fixture): the proxy's own selection surface — the docs
  # tools it fronts plus the mem_search dependency its surfacing engine calls
  # on every response. With the expected_exceptions below, every candidate
  # classifies authorized_but_governed: `--profile strict` rejects them all
  # as DENY_GOVERNED (the consumer's production default fails closed) while
  # `--profile review` passes them with the operator's stated reason.
  # `unsafe-tools stm-proxy` stays empty (violations only) — helper remains
  # this exhibit's only violation signal.
  - {agent: stm-proxy, tool: "memtomem::mem_search", granted_by: user}
  - {agent: stm-proxy, tool: "memtomem-stm::langchain__search_docs_by_lang_chain", granted_by: user}
  - {agent: stm-proxy, tool: "memtomem-stm::langfuse__searchLangfuseDocs", granted_by: user}
  - {agent: stm-proxy, tool: "memtomem-stm::langfuse__getLangfuseDocsPage", granted_by: user}
  - {agent: stm-proxy, tool: "memtomem-stm::langfuse__getLangfuseOverview", granted_by: user}

# Tool -[:READS|WRITES]-> Resource (declared data effects).
#
# The READS edges from proxied tools to memtomem namespaces are source-backed:
#   ProxyManager._apply_surfacing -> SurfacingEngine.surface -> mem_search
# applied to *every* proxied tool response (unconditionally in
# memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing).
# Default surfacing enabled=True per
# memtomem_stm/surfacing/config.py::SurfacingConfig.enabled.
data_access:
  # direct memtomem reads/writes
  - {tool: "memtomem::mem_add", resource: "memory:claude:toolgraph", mode: WRITES}
  - {tool: "memtomem::mem_search", resource: "memory:claude:toolgraph", mode: READS}
  - {tool: "memtomem::mem_read", resource: "memory:claude:toolgraph", mode: READS}
  - {tool: "memtomem::mem_recall", resource: "memory:claude:toolgraph", mode: READS}

  # the verified cross-server wedge: every proxied tool runs surfacing, which
  # calls mem_search on memtomem and may surface ANY indexed namespace.
  # We model the high-risk one — the operator's project working notes.
  # provenance.evidence points at the exact source path so a reviewer can
  # verify the edge without re-reading the whole demo.
  - tool: "memtomem-stm::langchain__search_docs_by_lang_chain"
    resource: "memory:claude:toolgraph"
    mode: READS
    provenance:
      source: inferred
      confidence: high
      evidence: "memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing -> memtomem_stm/surfacing/engine.py::SurfacingEngine.surface"
  - tool: "memtomem-stm::langfuse__searchLangfuseDocs"
    resource: "memory:claude:toolgraph"
    mode: READS
    provenance:
      source: inferred
      confidence: high
      evidence: "memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing -> memtomem_stm/surfacing/engine.py::SurfacingEngine.surface"
  - tool: "memtomem-stm::langfuse__getLangfuseDocsPage"
    resource: "memory:claude:toolgraph"
    mode: READS
    provenance:
      source: inferred
      confidence: high
      evidence: "memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing -> memtomem_stm/surfacing/engine.py::SurfacingEngine.surface"
  - tool: "memtomem-stm::langfuse__getLangfuseOverview"
    resource: "memory:claude:toolgraph"
    mode: READS
    provenance:
      source: inferred
      confidence: high
      evidence: "memtomem_stm/proxy/manager.py::ProxyManager._apply_surfacing -> memtomem_stm/surfacing/engine.py::SurfacingEngine.surface"

  # the proxied upstreams themselves (for completeness in blast-radius)
  - {tool: "memtomem-stm::langchain__search_docs_by_lang_chain", resource: "https://docs.langchain.com/mcp", mode: READS}
  - {tool: "memtomem-stm::langfuse__searchLangfuseDocs", resource: "https://langfuse.com/api/mcp", mode: READS}
  - {tool: "memtomem-stm::langfuse__getLangfuseDocsPage", resource: "https://langfuse.com/api/mcp", mode: READS}
  - {tool: "memtomem-stm::langfuse__getLangfuseOverview", resource: "https://langfuse.com/api/mcp", mode: READS}

governed_by:
  # Per-binding provenance: cite WHY this resource is bound to this policy.
  # ~/.memtomem/config.json declares the namespace-routing rule that puts this
  # repo's project memory under claude:toolgraph; stm_proxy.json lists the
  # upstreams that the surfacing engine queries. Both files together are the
  # source of the (resource, policy) binding's truth.
  "memory:claude:toolgraph":
    - policy: operator-ltm-confidentiality
      provenance:
        source: operator_asserted
        confidence: high
        evidence: "~/.memtomem/config.json (namespace.rules) + ~/.memtomem/stm_proxy.json"

# Intentional reach: planner is the project subagent — it's *supposed* to read
# the toolgraph memory namespace. Declaring the exception classifies planner's
# four reach paths as `authorized_but_governed` instead of `violation`, leaving
# helper's reaches as the real signal (still `violation`).
expected_exceptions:
  - agent: planner
    tool: "memtomem::mem_search"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "planner is the project subagent; reading project memory is by design"
  - agent: planner
    tool: "memtomem::mem_read"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "planner is the project subagent; reading project memory is by design"
  - agent: planner
    tool: "memtomem-stm::langchain__search_docs_by_lang_chain"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "planner uses docs+surfacing; project-memory injection is expected"
  - agent: planner
    tool: "memtomem-stm::langfuse__searchLangfuseDocs"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "planner uses docs+surfacing; project-memory injection is expected"

  # stm-proxy (wiring fixture): the proxy IS the surfacing pipeline — reading
  # project memory is its mechanism, not leakage. These declarations make its
  # reach authorized_but_governed, so strict still fails closed while review
  # passes; they prove agent_found no longer aborts and governed rejects are
  # classified — NOT that an out-of-box live consumer works (live refs are
  # built from upstream connection names, a different shape; see README).
  - agent: stm-proxy
    tool: "memtomem::mem_search"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "stm-proxy IS the surfacing pipeline; reading project memory is its mechanism, not leakage"
  - agent: stm-proxy
    tool: "memtomem-stm::langchain__search_docs_by_lang_chain"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "stm-proxy IS the surfacing pipeline; reading project memory is its mechanism, not leakage"
  - agent: stm-proxy
    tool: "memtomem-stm::langfuse__searchLangfuseDocs"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "stm-proxy IS the surfacing pipeline; reading project memory is its mechanism, not leakage"
  - agent: stm-proxy
    tool: "memtomem-stm::langfuse__getLangfuseDocsPage"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "stm-proxy IS the surfacing pipeline; reading project memory is its mechanism, not leakage"
  - agent: stm-proxy
    tool: "memtomem-stm::langfuse__getLangfuseOverview"
    resource: "memory:claude:toolgraph"
    policy: operator-ltm-confidentiality
    reason: "stm-proxy IS the surfacing pipeline; reading project memory is its mechanism, not leakage"
