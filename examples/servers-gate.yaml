# Illustrative companion integration configuration.
# Install and configure these optional servers separately; this is not a
# capture of the reader's workstation. The standalone quickstart needs neither.
servers:
  - name: memtomem
    transport: stdio
    command: uvx
    args: ["--from", "memtomem", "memtomem-server"]

  - name: memtomem-stm
    transport: stdio
    command: memtomem-stm
