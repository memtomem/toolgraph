version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ladybug is the graph backend; a minor bump changes storage behaviour
      # and is not covered by anything CI runs today. Bump it deliberately.
      - dependency-name: "ladybug"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
