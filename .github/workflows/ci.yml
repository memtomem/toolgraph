name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --frozen --group dev --extra ladybug
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # The suite is split on the `neo4j` marker, which conftest applies to every
  # test depending on the shared neo4j_container fixture. test-unit sets
  # TOOLGRAPH_TEST_NO_DOCKER, so a test that reaches that fixture without the
  # marker fails here instead of quietly starting Docker in the unit half.
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --frozen --group dev --extra ladybug
      - name: Require the optional local backend
        run: uv run python -c "import ladybug"
      - name: Run the tests that need no Docker
        env:
          TOOLGRAPH_TEST_NO_DOCKER: "1"
        run: uv run pytest -q -m "not neo4j"

  test-neo4j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --frozen --group dev --extra ladybug
      - name: Require the optional local backend
        run: uv run python -c "import ladybug"
      - name: Run the tests against real Neo4j
        run: uv run pytest -q -m neo4j
        env:
          TOOLGRAPH_TEST_NEO4J_EXPECT_VERSION: "5.26"

  # Neo4j 5.7 is the minimum server (Bolt 5.2 notification filtering), while
  # test-neo4j runs 5.26. This job runs the same suite on 5.7, and the script
  # checks that 5.6 is refused with the one documented line. The expected
  # version is declared apart from the image so an ignored override fails.
  minimum-neo4j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --frozen --group dev --extra ladybug
      - name: Run the tests against the minimum Neo4j server
        run: uv run pytest -q -m neo4j
        env:
          TOOLGRAPH_TEST_NEO4J_IMAGE: neo4j:5.7-community
          TOOLGRAPH_TEST_NEO4J_EXPECT_VERSION: "5.7"
      - name: Refuse a server below the minimum
        run: uv run python scripts/verify_neo4j_floor.py

  artifact-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python }}
      - run: uv build
      - run: uv venv --python ${{ matrix.python }} .artifact-venv
      - name: Locate built wheel
        shell: bash
        run: echo "WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - run: uv pip install --python .artifact-venv "${{ env.WHEEL }}[ladybug]"
      - run: uv run --python .artifact-venv --no-project toolgraph --version
      - run: uv run --python .artifact-venv --no-project toolgraph example init smoke
      - run: uv run --python ../.artifact-venv --no-project toolgraph init
        working-directory: smoke
      - run: uv run --python ../.artifact-venv --no-project toolgraph crawl --servers servers.yaml
        working-directory: smoke
      - run: uv run --python ../.artifact-venv --no-project toolgraph ingest-manifest --governance governance.yaml --strict-drift
        working-directory: smoke
      - run: uv run --python ../.artifact-venv --no-project toolgraph policy compile --agent vibe-coder --profile review --output .toolgraph/policy-bundle.json
        working-directory: smoke

  # Executes docs/notebooks from a wheel install, the way a reader's kernel
  # runs it. The default test suite only checks the committed outputs.
  # Required through ci-required: a notebook that no longer runs is a broken
  # first-run path.
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv sync --frozen --group dev --extra ladybug
      - run: uv build --wheel
      - run: uv venv "$RUNNER_TEMP/notebook-venv"
      - name: Locate built wheel
        run: echo "WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - run: uv export --frozen --only-group notebook --no-emit-project -o "$RUNNER_TEMP/notebook-requirements.txt"
      - run: uv pip install --python "$RUNNER_TEMP/notebook-venv/bin/python" "${{ env.WHEEL }}[ladybug]" -r "$RUNNER_TEMP/notebook-requirements.txt"
      - name: Execute the notebooks against the installed wheel
        run: TOOLGRAPH_NOTEBOOK_PYTHON="$RUNNER_TEMP/notebook-venv/bin/python" uv run pytest -q -rs tests/test_notebooks.py

  minimum-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv build
      - run: uv venv .minimum-venv
      - name: Locate built wheel
        run: echo "WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - run: uv pip install --python .minimum-venv "${{ env.WHEEL }}[ladybug]" "mcp==2.1.1"
      - run: uv run --python .minimum-venv --no-project toolgraph --version
      # `--version` alone proves the package imports, not that the declared
      # floor speaks the protocol. The steps below spawn the bundled MCP server
      # over stdio and drive it, so the server, client-session, transport and
      # pagination APIs are all exercised at 2.1.1 rather than at whatever the
      # lockfile resolves for every other job.
      - run: uv run --python .minimum-venv --no-project toolgraph example init smoke
      - run: uv run --python ../.minimum-venv --no-project toolgraph init
        working-directory: smoke
      - run: uv run --python ../.minimum-venv --no-project toolgraph crawl --servers servers.yaml
        working-directory: smoke
      - run: uv run --python ../.minimum-venv --no-project toolgraph ingest-manifest --governance governance.yaml --strict-drift
        working-directory: smoke
      - run: uv run --python ../.minimum-venv --no-project toolgraph eligible-tools vibe-coder "policy-gateway::read_note" "policy-gateway::publish_note"
        working-directory: smoke
      # The crawl above is stdio discovery and the query above is a local CLI
      # call, so neither reaches what the 2.x migration changed most: the
      # server's call_tool override and its error envelope, a continuation
      # cursor, both HTTP transports (streamable-http and legacy SSE), and
      # auth-header forwarding. This job is where those are proven at the
      # declared floor; keep this list in step with the script's legs.
      - run: uv run --python .minimum-venv --no-project python scripts/verify_mcp_floor.py

  # ADR-0017 step 2: Ladybug is a core dependency and the Neo4j driver is
  # the `neo4j` extra. This is the job that asserts the driver is absent and
  # drives both the CLI and the MCP server without it; jobs that install the
  # dev group get it through testcontainers[neo4j]. The negative leg runs in
  # a directory with no config file: in the initialized one the env/file
  # conflict check would answer before the missing extra does.
  no-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: uv build
      - run: uv venv .no-extras-venv
      - name: Locate built wheel
        run: echo "WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)" >> "$GITHUB_ENV"
      - run: uv pip install --python .no-extras-venv "${{ env.WHEEL }}"
      - name: The Neo4j driver is not installed
        run: |
          if uv run --python .no-extras-venv --no-project python -c "import neo4j"; then
            echo "neo4j is importable without the extra" >&2
            exit 1
          fi
      - run: uv run --python .no-extras-venv --no-project toolgraph example init smoke
      - run: uv run --python ../.no-extras-venv --no-project toolgraph init
        working-directory: smoke
      - run: uv run --python ../.no-extras-venv --no-project toolgraph crawl --servers servers.yaml
        working-directory: smoke
      - run: uv run --python ../.no-extras-venv --no-project toolgraph ingest-manifest --governance governance.yaml --strict-drift
        working-directory: smoke
      - run: uv run --python ../.no-extras-venv --no-project toolgraph eligible-tools vibe-coder "policy-gateway::read_note" "policy-gateway::publish_note"
        working-directory: smoke
      - run: uv run --python ../.no-extras-venv --no-project toolgraph policy compile --agent vibe-coder --profile review --output .toolgraph/policy-bundle.json
        working-directory: smoke
      - run: uv run --python ../.no-extras-venv --no-project python ../scripts/smoke_no_extras.py
        working-directory: smoke
      - name: Selecting Neo4j without the extra is one error line
        run: |
          mkdir neo4j-without-extra && cd neo4j-without-extra
          set +e
          # env -i: an inherited TOOLGRAPH_CONFIG or NEO4J_* would answer first.
          env -i PATH="$PATH" HOME="$HOME" TOOLGRAPH_BACKEND=neo4j \
            uv run --python ../.no-extras-venv --no-project toolgraph check 2> stderr.txt
          code=$?
          set -e
          cat stderr.txt
          test "$code" -eq 1
          test "$(wc -l < stderr.txt)" -eq 1
          grep -q "toolgraph\[neo4j\]" stderr.txt

  audit-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: scripts/audit-dependencies.sh runtime

  audit-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: scripts/audit-dependencies.sh extras

  audit-dev:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"
      - run: scripts/audit-dependencies.sh dev

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Matches release.yml. This job builds the artifacts and runs the
          # same verification the release runs, so it should exercise the
          # toolchain the release will use. The other jobs deliberately track
          # "latest" -- catching toolchain breakage early is their point.
          version: "0.12.3"
      - run: uv sync --frozen --group dev
      - run: uv build
      - run: uv run twine check dist/*
      - name: Verify the distributions
        # Same check release.yml runs, so a source distribution that stops
        # being buildable is caught on the pull request rather than by
        # whoever downloads it from PyPI. There is no tag here, so the version
        # comes from the package rather than from a filename.
        run: |
          VERSION="$(uv run --frozen python -c 'import toolgraph; print(toolgraph.__version__)')"
          scripts/verify-artifacts.sh dist "$VERSION"
      - name: Verify version single source
        run: uv run python -c "import pathlib, tomllib, toolgraph; assert toolgraph.__version__; assert 'version' not in tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']"

  # Single stable required check.
  #
  # Branch protection must require THIS job and nothing else. The matrix job
  # above reports as "artifact-smoke (ubuntu-latest, 3.14)" and friends, so
  # naming those directly means every matrix edit silently orphans a required
  # check and leaves pull requests waiting forever for a context that will
  # never report.
  #
  # audit-dev is deliberately excluded: it is continue-on-error, so depending
  # on it would make this gate meaningless. audit-runtime and audit-extras are
  # included — they are what release.yml runs before publishing, and leaving
  # them out would make this weaker than the checks it replaces.
  ci-required:
    needs:
      - lint
      - test-unit
      - test-neo4j
      - artifact-smoke
      - minimum-mcp
      - minimum-neo4j
      - no-extras
      - notebooks
      - audit-runtime
      - audit-extras
      - package
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = sorted(name for name, job in needs.items() if job.get('result') != 'success')
          print(' '.join(bad))
          ")
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed: $failed"
            exit 1
          fi
          echo "all required jobs succeeded"
