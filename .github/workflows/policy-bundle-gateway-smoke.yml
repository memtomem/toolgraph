name: Policy bundle gateway smoke

on:
  workflow_dispatch:
    inputs:
      memtomem_stm_ref:
        description: memtomem-stm git ref to exercise
        required: false
        default: main
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Toolgraph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolgraph
      - name: Checkout memtomem-stm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: memtomem/memtomem-stm
          ref: ${{ github.event.inputs.memtomem_stm_ref || 'main' }}
          path: memtomem-stm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Sync Toolgraph
        run: uv sync --project toolgraph --frozen --group dev --extra ladybug
      - name: Sync memtomem-stm
        run: uv sync --project memtomem-stm --frozen
      - name: Run advisory cross-repository smoke
        run: >-
          uv run --project toolgraph --frozen --group dev --extra ladybug python
          toolgraph/scripts/policy_bundle_gateway_smoke.py
          --memtomem-stm-root memtomem-stm
          --artifacts-dir "${{ runner.temp }}/policy-gateway-evidence"
      - name: Upload body-free evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-bundle-gateway-evidence
          path: ${{ runner.temp }}/policy-gateway-evidence/
          if-no-files-found: warn
          retention-days: 14
