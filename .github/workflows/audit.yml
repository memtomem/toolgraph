name: Dependency audit

# The lock is audited by ci.yml on pull requests and pushes to main, and by
# the release build, but never on a schedule: an advisory published against
# a lock nobody is changing waited for the next of those events. This runs the
# same three audits weekly against main. It is a separate workflow so ci.yml's
# required-check aggregation does not change.
#
# A red run means "the audit failed", which is not always "a vulnerability
# was found": `uv export --locked`, package installation and the advisory
# service can each fail for their own reasons. Read the log before acting.
#
# GitHub addresses a scheduled run's notifications to whoever last edited the
# cron line below (or, once the workflow has been re-enabled, to whoever
# re-enabled it), subject to that person's notification settings. It disables
# schedules on a public repository after 60 days without activity; re-enable
# the workflow before running it by hand with `workflow_dispatch`.

on:
  schedule:
    # Monday 06:17 UTC; off the hour, where GitHub delays or drops runs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit-${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [runtime, extras, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
      - run: scripts/audit-dependencies.sh ${{ matrix.scope }}
