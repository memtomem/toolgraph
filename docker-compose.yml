# Development-only Neo4j. Do not expose this compose service on a shared host.
# Pinned Neo4j 5.26 is the last LTS before calendar
# versioning; community edition is sufficient (no vector index / node-key needed).
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: toolgraph-neo4j
    ports:
      - "127.0.0.1:7474:7474" # browser, loopback only
      - "127.0.0.1:7687:7687" # bolt, loopback only
    environment:
      # Local throwaway credential, not a secret: this service is loopback-only
      # and holds disposable dev data. Follows NEO4J_PASSWORD from .env so the
      # database and toolgraph/config.py cannot disagree once you change it.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-toolgraph-dev}
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - toolgraph-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  toolgraph-neo4j-data:
