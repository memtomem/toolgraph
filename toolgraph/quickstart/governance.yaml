agents:
  - vibe-coder

policies:
  - id: draft-publish-deny
    effect: DENY
    scope: demo-drafts
    description: Publishing demo drafts requires an explicit policy review.

grants:
  - agent: vibe-coder
    tool: "policy-gateway::read_note"
    granted_by: quickstart
  - agent: vibe-coder
    tool: "policy-gateway::publish_note"
    granted_by: quickstart

data_access:
  - tool: "policy-gateway::read_note"
    resource: "file:///demo/notes"
    mode: READS
  - tool: "policy-gateway::publish_note"
    resource: "file:///demo/drafts"
    mode: WRITES

governed_by:
  "file:///demo/drafts":
    - draft-publish-deny
