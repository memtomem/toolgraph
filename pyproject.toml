[project]
name = "toolgraph"
dynamic = ["version"]
description = "Graph-native MCP/tool registry, policy compiler, and impact analyzer"
authors = [
    {name = "DAPADA Inc.", email = "contact@dapada.co.kr"},
    {name = "Toolgraph contributors"},
]
license = {text = "Apache-2.0"}
keywords = ["mcp", "ai", "agents", "governance", "policy", "graph", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Security floors for vulnerable transitive dependency versions.
    "cryptography>=48.0.1",
    "idna>=3.18",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "pydantic-settings>=2.14.2",
    "mcp>=1.28.1,<3",
    "neo4j>=6.2,<7",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.27.0",
    "python-dotenv>=1.0",
]

[project.scripts]
toolgraph = "toolgraph.cli:app"

[project.optional-dependencies]
ladybug = [
    "ladybug>=0.18.2,<0.19",
]

[project.urls]
Homepage = "https://github.com/memtomem/toolgraph"
Repository = "https://github.com/memtomem/toolgraph"
Issues = "https://github.com/memtomem/toolgraph/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    # Held below 0.16: that release expands the default rule set, and CI runs
    # `ruff check .` with no [tool.ruff] selection, so a bump silently changes
    # what lint means. Raise the ceiling together with an explicit rule set.
    "ruff>=0.15.22,<0.16",
    "testcontainers[neo4j]>=4.14.2",
    "jsonschema>=4",
    "twine>=7.0",
]
audit = ["pip-audit==2.10.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "toolgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["toolgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
