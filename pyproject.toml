[project]
name = "toolgraph"
dynamic = ["version"]
description = "Graph-native MCP/tool registry, policy compiler, and impact analyzer"
authors = [
    {name = "DAPADA Inc.", email = "contact@dapada.co.kr"},
    {name = "Toolgraph contributors"},
]
license = {text = "Apache-2.0"}
keywords = ["mcp", "ai", "agents", "governance", "policy", "graph", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Security floors for vulnerable transitive dependency versions.
    "cryptography>=50.0.0",
    "idna>=3.18",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "pydantic-settings>=2.14.2",
    "mcp>=2.1.1,<3",
    "neo4j>=6.2,<7",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.27.0",
    "python-dotenv>=1.0",
]

[project.scripts]
toolgraph = "toolgraph.cli:app"

[project.optional-dependencies]
ladybug = [
    "ladybug>=0.18.2,<0.19",
]

[project.urls]
Homepage = "https://github.com/memtomem/toolgraph"
Repository = "https://github.com/memtomem/toolgraph"
Issues = "https://github.com/memtomem/toolgraph/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    # Held below 0.16: that release expands the default rule set, and CI runs
    # `ruff check .` with no [tool.ruff] selection, so a bump silently changes
    # what lint means. Raise the ceiling together with an explicit rule set.
    "ruff>=0.15.22,<0.16",
    "testcontainers[neo4j]>=4.14.2",
    "jsonschema[format-nongpl]>=4",
    "twine>=7.0",
]
audit = ["pip-audit==2.10.1"]

[build-system]
# Pinned exactly. The release rehearsal (`test-v*` to TestPyPI) and the
# production tag are two separate builds, and an unpinned backend can put
# different bytes behind the same reviewed commit. `scripts/verify-artifacts.sh`
# asserts the sdist rebuilds the wheel byte for byte, which only holds while
# the backend is fixed. Bump deliberately, then rehearse.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "toolgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["toolgraph"]

# Explicit allowlist for the source distribution. Without it hatchling ships
# everything Git tracks (145 entries: tests, docs, examples, CI workflows,
# docker-compose.yml, the lockfile). The sdist is a build input for the wheel,
# not a repository mirror: it carries the package, the README PyPI renders as
# the project page, the license and changelog, and the JSON contracts.
# `contracts/fixtures/` is test data and is excluded with the tests.
[tool.hatch.build.targets.sdist]
include = [
    "toolgraph/",
    "contracts/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "pyproject.toml",
]
exclude = [
    "contracts/fixtures/",
    "docs/",
]
# Note: hatchling always ships the VCS ignore file (.gitignore) in an sdist;
# an exclude entry for it has no effect.

[tool.pytest.ini_options]
asyncio_mode = "auto"
