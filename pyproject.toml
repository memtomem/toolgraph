[project]
name = "toolgraph"
version = "0.1.0"
description = "Graph-native MCP/tool registry — advisory governance & impact analysis over a Neo4j graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.8",
    "neo4j>=6.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
toolgraph = "toolgraph.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "testcontainers[neo4j]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
